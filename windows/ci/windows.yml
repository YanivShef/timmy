name: windows

# INSTALL LOCATION: this file belongs at .github/workflows/windows.yml. It is kept here because the GitHub token on the
# dev machine has no "workflow" scope (GitHub refuses pushes that add workflow files without it). To enable CI:
#   gh auth refresh -h github.com -s workflow
#   git switch windows && mkdir -p .github/workflows && git mv windows/ci/windows.yml .github/workflows/windows.yml
#   git commit -m "CI: enable the Windows workflow" && git push

# Timmy for Windows (windows/). Runs on every push to the "windows" branch and on demand.
# Agents: git push, then `gh run watch` / `gh run view --log-failed`; artifacts with `gh run download`.
on:
  push:
    branches: [windows]
  workflow_dispatch:
    inputs:
      asr_bench:
        description: "Also measure ivrit.ai CT2 transcription speed on the runner CPU (downloads 1.6 GB)"
        type: boolean
        default: false
      asr_real:
        description: "Run the worker with the real ivrit.ai model (job asr-real; the model is cached between runs)"
        type: boolean
        default: true

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # UI tests run offscreen (screenshots with QWidget.grab, PDFs with QtWebEngine); the screen-share hiding test starts
  # its own process with the native "windows" platform (tests/affinity_probe.py)
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"

jobs:
  test:
    name: lint + import + pytest (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,audio,asr,system,ui]"

      # the 75 MB tiny Whisper model for the worker plumbing tests (tests/test_asr.py, tests/test_worker.py)
      - name: Cache tiny Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-tiny
          key: hf-faster-whisper-tiny-v1
      - name: Download tiny Whisper model (no-op when cached)
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('Systran/faster-whisper-tiny'))"

      # Runners have no sound card and Audiosrv may be stopped; try to start it so process-loopback activation can be
      # exercised for real. The WASAPI tests skip (with the HRESULT in the log) whatever this machine cannot do.
      - name: Windows Audio service (best effort)
        continue-on-error: true
        run: |
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table -AutoSize
          Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder
          Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table -AutoSize

      - name: Environment
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform()); print(sys.getwindowsversion())"
          python -m timmy --report
          python -m timmy.audio.capture --list
          python -c "import PySide6, PySide6.QtWebEngineCore, PySide6.QtPdf; print('PySide6', PySide6.__version__)"
          python -c "from timmy.engine import asr, claude, files; print('threads', asr.physical_threads(), 'cuda', asr.cuda_available(), 'ffmpeg', files.ffmpeg_path(), 'claude', repr(claude.find_claude()))"

      - name: Mac code in sync (tools/sync_mac.py --check)
        run: python tools/sync_mac.py --check

      - name: Capture smoke (2 s, real WASAPI, no devices required)
        shell: cmd           # cmd keeps the binary frame stream intact when redirecting to a file
        run: |
          if not exist out mkdir out
          python -m timmy.audio.capture --seconds 2 --ignore-stdin < NUL > out\capture-smoke.bin 2> out\capture-smoke.log
          set RC=%ERRORLEVEL%
          type out\capture-smoke.log
          for %%F in (out\capture-smoke.bin) do echo frames: %%~zF bytes
          exit /b %RC%

      - name: Lint (ruff)
        run: python -m ruff check . --output-format=github

      - name: Byte-compile everything
        run: python -m compileall -q timmy tests tools

      - name: Tests
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          python -m pytest -v --junitxml=out/junit.xml 2>&1 | Tee-Object -FilePath out/pytest.log
          exit $LASTEXITCODE

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: windows/out/
          if-no-files-found: ignore
          retention-days: 14

  asr-real:
    name: worker with the real ivrit.ai model (fixture, CPU)
    if: github.event_name == 'push' || inputs.asr_real
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,asr,system]"
      - name: Cache the ivrit.ai model (1.6 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--ivrit-ai--whisper-large-v3-turbo-ct2
          key: hf-ivrit-ai-whisper-large-v3-turbo-ct2-v1
      - name: Download model (no-op when cached)
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('ivrit-ai/whisper-large-v3-turbo-ct2'))"
      - name: Real-model tests (asr + worker, cpu profile, real time)
        env:
          TIMMY_TEST_REAL_MODEL: "1"
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          python -m pytest -v -m slow tests/test_asr.py tests/test_worker.py --junitxml=out/junit-asr-real.xml 2>&1 | Tee-Object -FilePath out/pytest-asr-real.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-real-output
          path: windows/out/
          if-no-files-found: ignore
          retention-days: 14

  asr-bench:
    name: ASR speed on runner CPU (on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.asr_bench
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[asr]"
      - name: Download model
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('ivrit-ai/whisper-large-v3-turbo-ct2'))"
      - name: Benchmark (all cores)
        run: python tools/bench_asr.py --out out/bench-all-cores.json
      - name: Benchmark (2 threads, a weak laptop)
        run: python tools/bench_asr.py --threads 2 --out out/bench-2-threads.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-bench
          path: windows/out/
          if-no-files-found: ignore
